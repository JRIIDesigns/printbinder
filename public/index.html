<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintBinder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 9.5v13L16 29 4 22.5v-13z' fill='%232f9e8f'/%3E%3Cpath d='M16 16 28 9.5M16 16v13M16 16 4 9.5' stroke='%23fff' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f5f7; --panel:#fff; --line:#d8dee5; --text:#0b1924; --dim:#5a6877; --accent:#4a8c0c; --accent-ink:#fff;
  --btn:#8fd42a; --btn-ink:#0b1924; --sky:#5fbdf0;
  --tile:#e7ecf1; --warn:#b4540a; --bad:#b3261e; --shadow:0 1px 2px rgba(11,25,36,.08),0 4px 14px rgba(11,25,36,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1924; --panel:#11222f; --line:#233849; --text:#e9eef3; --dim:#93a4b4; --accent:#a6e22e; --accent-ink:#0b1924;
  --btn:#a6e22e; --btn-ink:#0b1924; --sky:#8ed4f8;
  --tile:#182d3c; --warn:#f0a35a; --bad:#ff8a80; --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 18px;background:var(--panel);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--btn),var(--sky)) 1;flex:none}
h1{font-size:17px;margin:0 6px 0 0;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h1 img{height:40px;width:auto;display:block;-webkit-user-drag:none}
.tabs{display:flex;background:var(--tile);border-radius:9px;padding:3px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:7px;color:var(--dim);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:10px;background:var(--warn);color:#fff;font-size:12px;line-height:19px;text-align:center}
.badge:empty{display:none}
input[type=search],input[type=text],input[type=password]{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);user-select:text}
#q{flex:1 1 220px;max-width:420px}
input:focus,select:focus,button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;color:var(--dim)}
.chip.on{background:var(--btn);border-color:var(--accent);color:var(--btn-ink);font-weight:600}
select,.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px}
.btn:hover,.chip:hover{border-color:var(--accent)}
.btn.primary{background:var(--btn);border-color:var(--accent);color:var(--btn-ink);font-weight:600}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
#status{color:var(--dim);font-size:13px;margin-left:auto;text-align:right}
#status b{color:var(--accent)}
#status .st-sep{font-style:normal}
#q{min-width:110px}
/* Middling windows (a 1440-wide laptop, say): everything stays on one row. The search box gives up width first, gaps tighten,
   the count and the time stack in two short lines, and the word "optional" is left to the button's hover text. Narrower still, the row wraps as before. */
@media (min-width:821px) and (max-width:1820px){
  header{gap:8px 9px;padding:10px 14px}
  h1{margin-right:0}
  .tabs button{padding:5px 11px}
  #q{flex:1 1 120px}
  .chips{gap:4px} .chip{padding:4px 10px}
  #sort{max-width:148px;text-overflow:ellipsis}
  #status{font-size:12px;line-height:1.25;white-space:nowrap}
  #status b,#status span{display:block} #status .st-sep{display:none} #status b~.st-t{display:none}
  #aibtn .aiopt{display:none}
}
@media (min-width:821px) and (max-width:1420px){h1 #appname{display:none}}   /* the mark alone: the name is in the window's title and at the foot of the folder list */

#gallery{flex:1;display:flex;min-height:0}
#side{width:290px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
#sidehead{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 14px;color:var(--dim);font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase}
#sidehead button{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;padding:3px 9px}
#tree{flex:1;overflow:auto;padding:2px 8px 30px}
#notes{flex:none} #notes:empty{display:none}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 18px;background:var(--tile);border-bottom:1px solid var(--line);font-size:13px}
.note.warn{background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.note>span{flex:1;min-width:200px} .note .btn{padding:3px 10px;font-size:13px;flex:none}
.split{display:inline-flex} .split .btn:first-child:not(:last-child){border-top-right-radius:0;border-bottom-right-radius:0}
.split .btn+.btn{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-1px;padding-left:9px;padding-right:9px}
#sidefoot{flex:none;padding:6px 14px 8px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)} #sidefoot:empty{display:none}
.node{display:flex;align-items:center;border-radius:7px;border:1.5px solid transparent}
.node:hover{background:var(--tile)}
.node.on{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.node.drop,.sec.drop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 26%,transparent)}
.node .tw{width:20px;height:26px;border:0;background:none;color:var(--dim);padding:0;flex:none;font-size:10px}
.node .lb{flex:1;min-width:0;padding:4px 4px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.node .ct{color:var(--dim);font-size:12px;padding-right:8px;font-variant-numeric:tabular-nums}
.node.zero .lb{color:var(--dim)} .ct .ctoff{font-style:normal;white-space:nowrap;opacity:.8} .emptybtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.lock{display:inline-flex;align-items:center;flex:none;margin:0 4px;opacity:.6;cursor:help;vertical-align:middle} .lock svg,.tile .lock svg{width:11px;height:11px;fill:currentColor;stroke:none}
.sec .fnk{color:var(--text);font-weight:650}
#main{flex:1;overflow:auto;padding:4px 18px 90px;min-width:0}
section{content-visibility:auto;contain-intrinsic-size:auto 420px}
.sec{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 6px 6px;margin:2px -6px 2px;display:flex;align-items:baseline;gap:10px;border:1.5px solid transparent;border-radius:8px}
.sec h2{font-size:14px;margin:0;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec h2 span{color:var(--dim);font-weight:400}
.sec small{color:var(--dim)}
.sec .link{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;margin-left:auto;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:11px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .08s,box-shadow .08s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.th{aspect-ratio:1;background:var(--tile);display:grid;place-items:center;position:relative;overflow:hidden}
.th img,.th video{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.th img.photo{object-fit:cover}
.ph{color:var(--dim);font-weight:700;letter-spacing:.06em;font-size:20px;text-align:center}
.ph small{display:block;font-weight:400;font-size:11px;letter-spacing:0;margin-top:4px}
.ph.wait::before{content:"";display:block;width:26px;height:26px;margin:0 auto 10px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ph.wait::before{animation:none}.card{transition:none}}
.tag{position:absolute;left:7px;top:7px;background:rgba(15,20,28,.72);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;letter-spacing:.04em}
.ck{position:absolute;right:7px;top:7px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(15,20,28,.45);opacity:0;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.card:hover .ck,.card.sel .ck,body.selecting .ck{opacity:1}
.card.sel .ck{background:var(--btn);border-color:var(--accent)}
.card.sel .ck::after{content:"✓"}
.meta{padding:8px 10px 9px;min-width:0}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:550;font-size:13px;line-height:1.3;word-break:break-word;min-height:2.6em}
.sb{color:var(--dim);font-size:12px;margin-top:3px}
.card .nm{cursor:text;border-radius:5px}
.card .nm:hover{background:var(--tile);box-shadow:0 0 0 3px var(--tile)}
.nm.editing{display:flex;align-items:center;gap:3px;min-height:2.6em}
.rn{flex:1;min-width:0;padding:3px 6px;border:1px solid var(--accent);border-radius:6px;background:var(--bg);user-select:text;font-weight:550;font-size:13px}
.ext{color:var(--dim);font-size:12px;flex:none}
.dl h3{cursor:text}
.sec .fn{cursor:text;border-radius:5px;color:var(--text);font-weight:650}
.sec .fn:hover{background:var(--tile);box-shadow:0 0 0 3px var(--tile)}
.sec .fn.editing,.lb.editing{display:inline-flex;min-width:220px}
.lb.editing{flex:1;min-width:0;padding:1px 4px 1px 0}
.empty{color:var(--dim);padding:70px 20px;text-align:center}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

#selbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.25);border-radius:12px;padding:8px 10px 8px 16px;display:flex;gap:8px;align-items:center;z-index:5}
#selbar b{margin-right:6px}
#menu,#submenu{position:fixed;z-index:20;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.28);padding:5px}
#submenu{z-index:21}
#menu button,#submenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 12px;border-radius:6px;white-space:nowrap}
#menu button:hover:not(:disabled),#submenu button:hover:not(:disabled),#menu button.hot,#submenu button.hot,#menu button.opened{background:var(--tile)}
#menu button.danger{color:var(--bad)}
#menu button:disabled,#submenu button:disabled{opacity:.45;cursor:default}
#menu .c,#submenu .c{width:14px;flex:none;color:var(--accent);font-weight:700}
#menu .k,#submenu .k{margin-left:auto;padding-left:22px;color:var(--dim);font-size:12px}
#menu hr,#submenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

#review{flex:1;overflow:auto;padding:8px 18px 80px}
#review .wrap{max-width:1020px;margin:0 auto}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:11px 14px;margin:14px 0}
.rsec h2{font-size:15px;margin:26px 0 4px}
.rsec p{color:var(--dim);margin:0 0 10px}
.row{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.row .th{width:76px;flex:none;border-radius:8px}
.row .th .ph{font-size:13px}
.row .bd{flex:1;min-width:0;user-select:text}
.row .t1{font-weight:600;word-break:break-word}
.row .t2{color:var(--dim);font-size:13px;word-break:break-word}
.row .t2 code{color:var(--text)}
.row .act{display:flex;gap:8px;flex:none}
code{font:12.5px ui-monospace,Consolas,monospace;background:var(--tile);padding:1px 5px;border-radius:4px}
.arrow{color:var(--accent);font-weight:700}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,12,16,.6)}
#dlg{width:min(1000px,94vw);max-height:92vh}
.dl{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr)}
.dl .big{background:var(--tile);display:grid;place-items:center;min-height:320px;max-height:92vh}
.dl .big img,.dl .big video{max-width:100%;max-height:92vh;object-fit:contain;display:block}
.dl .side{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;user-select:text}
.dl h3{margin:0;font-size:16px;word-break:break-word;padding-right:20px}
.dl dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.dl dt{color:var(--dim)} .dl dd{margin:0;word-break:break-word}
.dl .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:10px}
.dl .big{position:relative}
.v3btn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);box-shadow:var(--shadow);padding:7px 18px}
.v3host{width:100%;height:min(80vh,720px);position:relative;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--tile) 60%,#fff 12%),var(--tile))}
.v3host canvas{display:block;width:100%;height:100%;cursor:grab;outline:0}
.v3host canvas:active{cursor:grabbing}
.v3host .ph{position:absolute;inset:0;display:grid;place-content:center}
.v3bar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;font-size:12.5px;color:var(--dim);pointer-events:none}
.v3bar b{flex:0 1 auto;min-width:0;color:var(--text);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 9px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto}
.v3bar span{flex:1 1 100%;min-width:0;line-height:1.3;text-wrap:balance}   /* the hint has a line of its own above the size, and may wrap */
.v3bar button{flex:none;margin-left:auto;pointer-events:auto;padding:3px 10px;white-space:nowrap}
.x{z-index:3;position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--dim);line-height:1}
.box{padding:18px 20px;width:min(460px,92vw)}
.box h3{margin:0 0 4px;font-size:16px}
.box p{margin:0 0 12px;color:var(--dim);word-break:break-word} #askP{white-space:pre-line}
.box input{width:100%}
.box .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#pick .box{width:min(560px,92vw)}
#picklist{height:min(46vh,420px);overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:4px}
#picklist:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.prow{display:flex;align-items:center;border-radius:6px;cursor:pointer;white-space:nowrap;border:1.5px solid transparent}
.prow:hover{background:var(--tile)}
.prow.on{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)}
.prow .tw{width:22px;height:26px;flex:none;display:grid;place-items:center;color:var(--dim);font-size:10px}
.prow .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:3px 8px 3px 0}
#picklist small{color:var(--dim)}
.phd{margin:8px 0 2px;padding:8px 8px 2px;border-top:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.pnone{padding:10px;color:var(--dim);margin:0}
#pickrec{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--dim)} #pickrec:empty{display:none}
#pickrec .chip{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 10px;font-size:13px;color:var(--text)}
#pickTo{margin:8px 0 0!important;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #pickTo b{color:var(--text)}
#pick .btns{margin-top:10px} #pickN{margin-right:auto}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#0b1924;border:1px solid #233849;color:#fff;padding:9px 12px 9px 16px;border-radius:9px;box-shadow:var(--shadow);max-width:80vw;z-index:30;display:flex;gap:12px;align-items:center}
#toast button{border:0;background:#a6e22e;color:#0b1924;font-weight:650;border-radius:6px;padding:3px 11px}
#aibtn{display:flex;align-items:center;gap:6px;font-weight:600}
#aibtn svg{width:15px;height:15px;fill:var(--btn)}
#aibtn.on{border-color:var(--accent)}
#ai{position:fixed;right:0;bottom:0;top:54px;width:390px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:4;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
body.aiopen #gallery,body.aiopen #review{margin-right:390px}
@media (max-width:1100px){body.aiopen #gallery,body.aiopen #review{margin-right:0}}
.aih{display:flex;align-items:center;gap:8px;padding:9px 10px 8px 16px;border-bottom:1px solid var(--line);flex:none}
.aih b{font-size:15px;margin-right:auto}
.aih .btn{padding:3px 9px;font-size:13px}
.aih .x2{border:0;background:none;font-size:22px;color:var(--dim);line-height:1;padding:0 6px}
#aitop{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;max-height:62%;overflow:auto;flex:none}
#aitop p{margin:0;color:var(--dim);font-size:13px}
#aitop p b{color:var(--text)}
.aiacts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.aiacts .btn{text-align:left;padding:7px 10px;font-weight:600}
.aiacts small{display:block;color:var(--dim);font-size:11.5px;font-weight:400}
.bar{height:6px;border-radius:3px;background:var(--tile);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--btn),var(--sky));transition:width .4s}
.bar.ind i{width:35%;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.ainote{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ainote span{flex:1;min-width:150px}
.aierr{color:var(--bad)}
.linkb{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;text-align:left}
#aichat{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:90px;user-select:text}
#aichat .hint{color:var(--dim);font-size:13px}
#aichat .hint button{display:block;margin-top:6px}
.msg{max-width:94%;padding:8px 11px;border-radius:12px;font-size:13.5px;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--btn);color:var(--btn-ink)}
.msg.assistant{align-self:flex-start;background:var(--tile)}
.msg.err{align-self:flex-start;color:var(--bad);border:1px solid var(--line)}
.msg .extra{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.msg .extra .btn{padding:3px 9px;font-size:12.5px}
.msg.wait{color:var(--dim)}
#aiform{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex:none;align-items:stretch}
#aiq{flex:1;resize:none;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font:inherit;color:inherit;user-select:text}
.aiset label{display:block;font-size:12.5px;color:var(--dim);margin:8px 0 3px}
.aiset select,.aiset input{width:100%}
.aiset .kr{display:flex;gap:6px}
.pickbar{position:sticky;top:0;z-index:3;display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--bg));border:1px solid var(--accent);border-radius:9px;padding:7px 12px;margin:8px 0 2px}
.pickbar span{flex:1}
.dsc{margin:0;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tg{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--dim)}
.tg:hover{border-color:var(--accent);color:var(--text)}
.rsec h2 .btn{font-weight:400;font-size:13px;margin-left:10px;padding:3px 10px}
.aih .ic{padding:4px 7px;display:grid;place-items:center}
.aih .ic svg,#aimic svg{width:15px;height:15px;fill:currentColor;display:block}

<script>
const $ = s => document.querySelector(s);
const REMOTE = document.body.classList.contains('remote');   // this page is being used from a paired phone or tablet, not the computer's own window
if (matchMedia('(pointer:coarse)').matches || (navigator.maxTouchPoints > 0 && /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent))) document.body.classList.add('touch');
const DRAG = !document.body.classList.contains('touch');   // dragging is for a mouse; a finger gets "Move to…" instead
const NARROW = matchMedia('(max-width:820px)');
// The assistant in use — Claude, ChatGPT or Gemini — by the name its maker gives it: one for sorting, plans and chat, one for describing pictures.
let AINAME = 'Claude', AINAMED = 'Claude';
const AIN = () => AINAME, AIND = () => AINAMED;
// The program's own name. It is told to the page by the desktop window (through /api/about), so a rename is made in one place.
const BRAND = { name: 'PrintBinder', maker: '', publisher: '', licence: '', copyright: '', feedbackEmail: '', website: '' };
const APP = () => BRAND.name;
const aiOn = st => !!st && (st.providers ? Object.values(st.providers).some(p => p.set) : !!(st.key && st.key.set));
let PT = 'mouse';   // what the latest press was made with: mouse, touch or pen
addEventListener('pointerdown', e => { PT = e.pointerType || 'mouse'; }, true);
const byTouch = () => PT === 'touch' || NARROW.matches;
const fingers = () => PT === 'touch' || document.body.classList.contains('touch');   // an on-screen keyboard is in play
// when a phone's keyboard closes, make sure the page sits back at the top of the screen (iOS can leave it shifted)
if (document.body.classList.contains('touch')) document.addEventListener('focusout', () => setTimeout(() => { if (!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) scrollTo(0, 0); }, 120));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : b < 1073741824 ? (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB' : (b / 1073741824).toFixed(2) + ' GB';
const fmtDate = m => new Date(m).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
const fileURL = p => '/file?p=' + encodeURIComponent(p);
const baseOf = p => p.slice(p.lastIndexOf('/') + 1);
const dirOf = p => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); };
const VIDEO = new Set(['mp4', 'mov', 'webm', 'm4v']);
// a path in another location is stored as ":Name/sub/file"; people see it as "↗ Name/sub/file"
const nice = p => p && p[0] === ':' ? '↗ ' + p.slice(1) : p;
// The name of a file or folder as it is SHOWN. A location's own folder is ":Name" inside the program; in anything people read
// (messages, questions, titles) it is "↗ Name", never with the colon. Use these two wherever a name goes into words.
const nameOf = p => nice(baseOf(p));
const nameOfDir = d => d ? '“' + nameOf(d) + '”' : 'the top folder';
const absPath = p => {
  const win = x => x.replace(/\//g, '\\');
  if (p[0] !== ':') return S.root + '\\' + win(p);
  const i = p.indexOf('/'), nm = (i < 0 ? p : p.slice(0, i)).slice(1).toLowerCase(), l = (S.locs || []).find(x => !x.home && x.name.toLowerCase() === nm);
  return l ? l.root + (i < 0 ? '' : '\\' + win(p.slice(i + 1))) : p;
};
const cmp = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;

// What this device remembers between visits (its own browser storage). Everything works without it.
const LS = { get(k, d) { try { const v = localStorage.getItem('pg-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('pg-' + k, JSON.stringify(v)); } catch {} } };
const oneOf = (v, list, d) => list.includes(v) ? v : d;
// size: xl, l, m, s (picture sizes) or d (Details list). layout: 'all' = every subfolder's files under headings, 'tiles' = subfolders as folders to open.
// cur: the path of the file or folder tile the keyboard is on. tiles: the folder tiles on show. anchor: where a Shift+arrow selection began.
const S = { files: [], dirs: [], byKey: new Map(), byPath: new Map(), q: '', kinds: new Set(['m', 'i']), folder: String(LS.get('folder', '') || ''), sort: oneOf(LS.get('sort'), ['name', 'new', 'added', 'big', 'type', 'folder', 'colour', 'dim', 'parts', 'designer', 'desc', 'prob'], 'name'), rev: LS.get('rev') === true, view: 'gallery', hidden: 0,
  size: oneOf(LS.get('size'), ['xl', 'l', 'm', 's', 'd'], 'm'), layout: oneOf(LS.get('layout'), ['all', 'tiles'], 'all'), cur: null, tiles: [], anchor: -1,
  seq: 0, shown: [], open: new Set([].concat(LS.get('open', [])).filter(x => typeof x === 'string')), sel: new Set(), lastSel: -1, scannedAt: 0, pending: 0, sig: '', root: '', trash: '', error: '' };
// Cut, copy and paste. mode is '' (empty), 'cut' or 'copy'; items are library paths of files and folders.
const CLIP = { mode: '', items: [], set: new Set() };
// PG is where later additions plug in:
//   PG.copyReady + PG.copyItems(items, to)  — pasting a copy; until both are set, pasting a copy only says it is on its way
//   PG.menuExtras.file / .folder / .space    — functions (ctx) => a menu item ({ label, fn, key, ch, danger, sub }) or null, added to those menus
//   PG.undone                                — what Undo put back, newest last: one list per undo, each entry { t, type, from, to } (t is the ticket Redo hands back to the app)
//   PG.menu(cmd)                             — what the desktop window's Edit menu calls; answers 'text' when a text box should deal with it instead
const PG = window.PG = { clip: CLIP, copyReady: false, copyItems: null, menuExtras: { file: [], folder: [], space: [] }, undone: [] };
const RO = () => document.body.classList.contains('lookonly');   // look-only: this copy of the app is older than the library
const canChange = () => RO() ? (toast('Look only — nothing can be changed until ' + APP() + ' is updated.'), false) : true;
// Folders whose name and place are never changed: the ones Windows and other programs depend on (Downloads, Documents, the user folder…, sent by the app as "kept") and each location's own top folder. The app refuses these itself; the window does not offer them. Everything inside such a folder is as usable as anywhere else, and files can be dropped onto it.
const KEPT = new Set();
const isLocTop = d => typeof d === 'string' && d[0] === ':' && !d.includes('/');
const kept = d => typeof d === 'string' && !!d && (isLocTop(d) || KEPT.has(d.toLowerCase()));
const KEPT_WHY = 'Windows and your other programs use this folder, so its name and place are left alone. The files inside it can still be moved.';
const LOC_WHY = 'This is the folder itself, as it is named on your computer. Its name and place are left alone. The files inside it can still be moved.';
const keptSay = d => toast(isLocTop(d) ? `“${d.slice(1)}” is one of the places ${APP()} shows, so ${APP()} leaves its name and place alone. The files inside it can still be moved.` : `“${nameOf(d)}” is a folder Windows and your other programs use, so ${APP()} leaves its name and place alone. The files inside it can still be moved.`);
const freeOnly = items => { const k = items.filter(kept); if (k.length) keptSay(k[0]); return k.length ? items.filter(i => !kept(i)) : items; };   // what may be cut, moved or removed; says why when something was left out
const LOCK = '<span class="lock" title="' + KEPT_WHY + '" aria-label="Its name and place are left alone"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2H13v7H3V7zm2 0h3V5a1.5 1.5 0 0 0-3 0z"/></svg></span>';

async function api(url, body) {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Gallery': '1' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({ error: 'The gallery did not answer properly.' }));
  if (r.status === 401 && REMOTE) { location.replace('/'); throw new Error('This device is no longer paired.'); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'Request failed'), { data: j });   // data: what else the answer held (a question to ask before a broad folder is added)
  if (body && /^\/api\/(fs\/(move|copy|import|remove|rename|mkdir)|review\/apply|zip\/extract)/.test(url)) PG.undone.length = 0;   // something new was done: there is nothing left to redo
  return j;
}
let toastT;
// The message at the foot of the window. An open window (a dialog) sits above everything else on the page and nothing outside it can
// be pressed, so while one is open the message lives inside it; it goes back to the page when the window closes, and is put back
// if a window draws itself again and sweeps it away.
const TOAST = $('#toast');
const toastHost = () => [...document.querySelectorAll('dialog[open]')].pop() || document.body;
new MutationObserver(() => { if (!TOAST.isConnected) toastHost().append(TOAST); }).observe(document.body, { childList: true, subtree: true });
function toast(msg, action) {
  const t = TOAST;
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.hidden = true; action.fn(); };
  const host = toastHost();
  if (t.parentNode !== host) host.append(t);
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, action ? 9000 : 4200);
}

document.addEventListener('close', e => { if (e.target.contains && e.target.contains(TOAST)) toastHost().append(TOAST); }, true);   // a window that closes hands the message back
// ---------- small dialogs (Electron has no prompt()) ----------
// cancel: other wording for the Cancel button, for a question with two real answers; it then starts with the focus (it is the one that changes nothing)
// extra: wording for a third button (such as "Try again"); pressing it answers { extra: true }
function ask({ title, text = '', value = null, ok = 'OK', danger = false, selectTo = -1, cancel = '', extra = '' }) {
  return new Promise(resolve => {
    const d = $('#ask'), i = $('#askI');
    $('#askT').textContent = title; $('#askP').textContent = text; $('#askP').hidden = !text;
    i.hidden = value === null; i.value = value || '';
    $('#askOK').textContent = ok; $('#askOK').className = 'btn ' + (danger ? 'danger' : cancel ? '' : 'primary');
    $('#askC').textContent = cancel || 'Cancel'; $('#askC').className = 'btn' + (cancel ? ' primary' : '');
    d.returnValue = 'cancel';

// Claude's move suggestions, grouped by the folder they lead to so a whole group can be judged at once
function moveGroups() {

  const groups = [...by].sort((a, b) => cmp(a[0], b[0]));   // a fixed order: approving files must not shuffle the groups about

  return `<div class="rsec"><h2>${whoMade('ai-move')}: suggested moves <span class="badge">${items.length}</span>${items.length > 1 ? `<button class="btn primary" data-all="ai-move">Approve all ${items.length}</button>` : ''}<button class="btn" data-clear="moves">Clear these</button>${items.length > 1 ? '<button class="linkb" data-selall="ai-move">Select all</button>' : ''}${groups.length > 1 ? `<button class="linkb" data-foldall>${allFold ? 'Expand all' : 'Minimise all'}</button>` : ''}</h2>

// Several folders split one after another: one go-ahead, then each folder is sent in turn and its suggestions land in Review.
async function splitMany(dirs) {
  if (!aiOn(AI.st)) { toggleAI(true); return toast('Add your API key in the ' + AIN() + ' panel first.'); }
  const ok = dirs.filter(d => S.files.filter(f => f.d === d).length >= 4), few = dirs.length - ok.length;
  if (!ok.length) return toast('There are too few files directly in ' + (dirs.length === 1 ? 'that folder' : 'those folders') + ' to split.');
  if (!(await ask({ title: ok.length === 1 ? `Ask ${AIN()} to split “${nameOf(ok[0])}”?` : `Ask ${AIN()} to split these ${ok.length} folders?`, text: `${AIN()} reads the names and descriptions of the files directly in ${ok.length === 1 ? 'this folder' : 'each folder, one folder after another'}, along with your folder names, and suggests a specific home for each file. The suggestions go to Review; nothing moves until you approve.` + (few ? ` ${few} with fewer than four files ${few === 1 ? 'is' : 'are'} left out.` : ''), ok: 'Split with ' + AIN() + '' }))) return;
  RSEL.clear(); renderReview();
  for (let i = 0; i < ok.length; i++) {
    try {
      aiApply(await api('/api/ai/split', { dir: ok[i] }));
      if (ok.length > 1) toast(`Splitting ${i + 1} of ${ok.length}: ${nameOf(ok[i])}…`);
      for (;;) {
        await new Promise(r => setTimeout(r, 1500));
        const st = await api('/api/ai/status'); aiApply(st);
        if (!st.run || !st.run.active) { if (st.run && st.run.error) throw new Error(st.run.error); break; }
      }
    } catch (e) { toast(e.message); break; }
  }
  if (S.view === 'review') await loadReview();
}async function splitFolder(d) {
  if (!aiOn(AI.st)) { toggleAI(true); return toast('Add your API key in the ' + AIN() + ' panel first.'); }
  const n = S.files.filter(f => f.d === d).length;
  if (n < 4) return toast('There are too few files directly in that folder to split.');
  if (!(await ask({ title: `Ask ${AIN()} to split “${nameOf(d)}”?`, text: `${AIN()} reads the names and descriptions of the ${n} files directly in this folder, along with your folder names, and suggests a specific home for each one: an existing folder that fits, or a new folder beside this one when four or more belong together. Files that fit nowhere stay put. The suggestions go to Review; nothing moves until you approve.`, ok: 'Split with ' + AIN() + '' }))) return;
  try { aiApply(await api('/api/ai/split', { dir: d })); toggleAI(true); } catch (e) { toast(e.message); }
}

const SAY = { on: false, voice: '', rate: 1 };   // kept per computer by the app, so it survives restarts

const savePrefs = () => { if (REMOTE) { try { localStorage.setItem('pg-say', JSON.stringify({ say: SAY.on, voice: SAY.voice, rate: SAY.rate })); } catch {} return; } api('/api/prefs', { say: SAY.on, voice: SAY.voice, rate: SAY.rate }).catch(() => {}); };
const voices = () => window.speechSynthesis ? speechSynthesis.getVoices() : [];
function voiceHTML() {
  const vs = voices().slice().sort((a, b) => cmp(a.name, b.name));
  if (!vs.length) return '<label>Voice for reading answers aloud</label><p>' + (REMOTE ? 'This device reports no voices.' : 'Windows reports no voices on this computer yet. Add one in Windows Settings → Time &amp; language → Speech.') + '</p>';
  const rates = [[0.85, 'Slower'], [1, 'Normal'], [1.15, 'A little faster'], [1.3, 'Faster'], [1.5, 'Fastest']];
  return `<label for="aivoice">Voice for reading answers aloud</label><div class="kr"><select id="aivoice" data-voice><option value="">${REMOTE ? 'This device’s default' : 'Windows default'}</option>${vs.map(v => `<option value="${esc(v.name)}"${v.name === SAY.voice ? ' selected' : ''}>${esc(v.name.replace(/^Microsoft /, '').replace(/ - .*$/, ''))} · ${esc(v.lang)}</option>`).join('')}</select><button class="btn" data-ai="voicetest">Test</button></div>
    <label for="airate">Reading speed</label><select id="airate" data-rate>${rates.map(([r, n]) => `<option value="${r}"${r === SAY.rate ? ' selected' : ''}>${n}</option>`).join('')}</select>
    <p style="margin-top:6px">Turn reading on or off with the speaker button above.${REMOTE ? '' : ' More voices can be added in Windows Settings → Time &amp; language → Speech.'}</p>`;

function speak(text, force) {
  if ((!SAY.on && !force) || !window.speechSynthesis) return;

  ['find', 'Find models online', () => `<p>On the computer, <b>Find models</b> in the top bar (or File > Find models online, Ctrl+B) opens a second window for model sites. Its start page has Printables, MakerWorld, Creality Cloud and Thingiverse. Any other site works too: type its address in the bar, and <b>Save site</b> keeps the page you are on for next time.</p>
